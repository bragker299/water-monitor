<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水位與溫度即時監測系統</title>
  <!-- 載入 Firebase 與 Chart.js -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #262626;
    }
    .status-badge {
      display: flex;
      align-items: center;
      background-color: #052e16;
      border: 1px solid #15803d;
      color: #22c55e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 8px #22c55e;
    }
    .label {
      color: #888;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value-water {
      font-size: 3.2rem;
      font-weight: 800;
      color: #00ff66;
      line-height: 1.1;
    }
    .value-water span {
      font-size: 1.2rem;
      font-weight: 400;
      color: #00ff66;
    }
    .value-temp {
      font-size: 2.2rem;
      font-weight: 700;
      color: #00e5ff;
    }
    .meta-info {
      color: #666;
      font-size: 0.85rem;
      margin-top: 16px;
      border-top: 1px solid #222;
      padding-top: 12px;
      line-height: 1.6;
    }
    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 連線狀態欄 -->
  <div class="status-badge">
    <div class="status-dot"></div>
    <span>已連接至 Firebase</span>
  </div>

  <!-- 水位數據 -->
  <div class="label">REAL-TIME WATER LEVEL</div>
  <div class="value-water" id="waterLevel">0 <span>mm</span></div>

  <br>

  <!-- 溫度數據 -->
  <div class="label">TEMPERATURE</div>
  <div class="value-temp" id="temperature">0.0 °C</div>

  <div class="meta-info">
    最後更新：<span id="updateTime" style="color:#eee;">--</span><br>
    設備電壓：<span id="batteryVolts" style="color:#eee;">0.00 V</span>
  </div>

  <br>

  <!-- 圖表卡片 -->
  <div class="card">
    <div class="label" style="margin-bottom:12px;">水位歷史趨勢</div>
    <div class="chart-container">
      <canvas id="waterChart"></canvas>
    </div>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      databaseURL: "https://esp32-water-monitor-ceafc-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 初始化 Chart.js 折線圖
    const ctx = document.getElementById('waterChart').getContext('2d');
    const waterChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '水位 (mm)',
          data: [],
          borderColor: '#00ff66',
          backgroundColor: 'rgba(0, 255, 102, 0.15)',
          borderWidth: 2,
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: '#00ff66'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { 
            grid: { color: '#222' }, 
            ticks: { color: '#666', font: { size: 10 }, maxRotation: 45 } 
          },
          y: { 
            grid: { color: '#222' }, 
            ticks: { color: '#666', font: { size: 10 } },
            beginAtZero: true
          }
        },
        plugins: { 
          legend: { display: false } 
        }
      }
    });

    // 監聽 Firebase 'sensor_data'（擷取最新 20 筆歷史紀錄）
    const sensorRef = database.ref('sensor_data').limitToLast(20);

    sensorRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const times = [];
      const waterLevels = [];
      let latestData = null;

      Object.keys(data).forEach((key) => {
        latestData = data[key];
        
        let timeStr = "--:--";
        if (latestData.timestamp) {
          const d = new Date(latestData.timestamp);
          timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        times.push(timeStr);
        waterLevels.push(latestData.water_level_mm || 0);
      });

      if (latestData) {
        document.getElementById('waterLevel').innerHTML = `${latestData.water_level_mm || 0} <span>mm</span>`;
        document.getElementById('temperature').innerText = `${latestData.temperature_c || 0} °C`;
        document.getElementById('batteryVolts').innerText = `${latestData.battery_v || 0} V`;
        
        let updateTimeStr = "--";
        if (latestData.timestamp) {
          const d = new Date(latestData.timestamp);
          updateTimeStr = d.toLocaleString('zh-HK', { hour12: false });
        } else {
          updateTimeStr = new Date().toLocaleString('zh-HK', { hour12: false });
        }
        document.getElementById('updateTime').innerText = updateTimeStr;
      }

      waterChart.data.labels = times;
      waterChart.data.datasets[0].data = waterLevels;
      waterChart.update();
    });
  </script>
</body>
</html>
